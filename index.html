<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slim 24h Flip Clock & Progress Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-soft: #FFF8F8;
      --border-greige: #DBD5D7;
      --clock-bg: #362729;
      --clock-bg-top: #3B2B2D;
      --clock-text: #FFFFFF;
      --label-text: rgba(54, 39, 41, 0.72);
      --bar-fill: #615357;
      --bar-track: rgba(219, 213, 215, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    /* 전체적으로 작고 슬림한 컨테이너 */
    .widget-container {
      width: 100%;
      max-width: 190px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 상단 플립 시계 영역 (가로 좁고 세로 길게) */
    .clock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
    }

    .flip-unit {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.48; /* 세로로 길쭉한 비율 */
      background-color: var(--clock-bg);
      perspective: 500px;
      border-radius: 0px;
      overflow: hidden;
    }

    .flip-half {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      color: var(--clock-text);
      font-size: 2.15rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      backface-visibility: hidden;
    }

    .flip-half span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1;
    }

    .flip-top, .flip-leaf-front {
      top: 0;
      background-color: var(--clock-bg-top);
      border-bottom: 1px solid rgba(255, 248, 248, 0.14);
    }

    .flip-top span, .flip-leaf-front span {
      top: 0;
    }

    .flip-bottom, .flip-leaf-back {
      bottom: 0;
      background-color: var(--clock-bg);
    }

    .flip-bottom span, .flip-leaf-back span {
      bottom: 0;
    }

    .flip-leaf-front {
      z-index: 2;
      transform-origin: 50% 100%;
    }

    .flip-leaf-back {
      z-index: 3;
      transform-origin: 50% 0%;
      transform: rotateX(90deg);
    }

    .flip-unit.flipping .flip-leaf-front {
      animation: flipDownTop 0.28s ease-in forwards;
    }

    .flip-unit.flipping .flip-leaf-back {
      animation: flipDownBottom 0.28s 0.28s ease-out forwards;
    }

    @keyframes flipDownTop {
      0% {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
      100% {
        transform: rotateX(-90deg);
        filter: brightness(0.75);
      }
    }

    @keyframes flipDownBottom {
      0% {
        transform: rotateX(90deg);
        filter: brightness(0.8);
      }
      100% {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
    }

    /* 우측 하단 요일 표기 */
    .clock-sub {
      position: absolute;
      bottom: 7px;
      right: 8px;
      z-index: 5;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
    }

    /* 하단 프로그레스 바 영역 */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 38px 28px 1fr;
      align-items: center;
      gap: 6px;
    }

    .progress-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--label-text);
      text-transform: lowercase;
      letter-spacing: -0.01em;
    }

    .progress-percent {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--label-text);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background-color: var(--bar-track);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--bar-fill);
      border-radius: 999px;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- 상단 24시간제 플립 시계 위젯 -->
    <div class="clock-grid">
      <!-- 시(Hour) 플립 카드 -->
      <div class="flip-unit" id="hour-unit">
        <div class="flip-half flip-top"><span>00</span></div>
        <div class="flip-half flip-bottom"><span>00</span></div>
        <div class="flip-half flip-leaf-front"><span>00</span></div>
        <div class="flip-half flip-leaf-back"><span>00</span></div>
      </div>

      <!-- 분(Minute) 플립 카드 -->
      <div class="flip-unit" id="minute-unit">
        <div class="flip-half flip-top"><span>00</span></div>
        <div class="flip-half flip-bottom"><span>00</span></div>
        <div class="flip-half flip-leaf-front"><span>00</span></div>
        <div class="flip-half flip-leaf-back"><span>00</span></div>
        <span class="clock-sub" id="weekday">THU</span>
      </div>
    </div>

    <!-- 하단 진행률 바 위젯 -->
    <div class="progress-list">
      <div class="progress-row">
        <span class="progress-label">year</span>
        <span class="progress-percent" id="year-pct">0%</span>
        <div class="progress-track">
          <div class="progress-fill" id="year-bar"></div>
        </div>
      </div>

      <div class="progress-row">
        <span class="progress-label">month</span>
        <span class="progress-percent" id="month-pct">0%</span>
        <div class="progress-track">
          <div class="progress-fill" id="month-bar"></div>
        </div>
      </div>

      <div class="progress-row">
        <span class="progress-label">week</span>
        <span class="progress-percent" id="week-pct">0%</span>
        <div class="progress-track">
          <div class="progress-fill" id="week-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentHourStr = null;
    let currentMinuteStr = null;

    function setUnitInstant(unitEl, val) {
      unitEl.querySelectorAll('span:not(.clock-sub)').forEach(el => {
        el.textContent = val;
      });
    }

    function flipTo(unitEl, oldVal, newVal) {
      if (oldVal === null || oldVal === newVal) {
        setUnitInstant(unitEl, newVal);
        return;
      }

      const topStatic = unitEl.querySelector('.flip-top span');
      const bottomStatic = unitEl.querySelector('.flip-bottom span');
      const leafFront = unitEl.querySelector('.flip-leaf-front span');
      const leafBack = unitEl.querySelector('.flip-leaf-back span');

      topStatic.textContent = newVal;
      bottomStatic.textContent = oldVal;
      leafFront.textContent = oldVal;
      leafBack.textContent = newVal;

      unitEl.classList.remove('flipping');
      void unitEl.offsetWidth;
      unitEl.classList.add('flipping');

      setTimeout(() => {
        bottomStatic.textContent = newVal;
        leafFront.textContent = newVal;
        unitEl.classList.remove('flipping');
      }, 570);
    }

    function updateWidget() {
      const now = new Date();

      // 24시간제 적용
      const hours = now.getHours();
      const minutes = now.getMinutes();

      const hourStr = String(hours).padStart(2, '0');
      const minuteStr = String(minutes).padStart(2, '0');

      const hourUnit = document.getElementById('hour-unit');
      const minuteUnit = document.getElementById('minute-unit');

      if (currentHourStr !== hourStr) {
        flipTo(hourUnit, currentHourStr, hourStr);
        currentHourStr = hourStr;
      }

      if (currentMinuteStr !== minuteStr) {
        flipTo(minuteUnit, currentMinuteStr, minuteStr);
        currentMinuteStr = minuteStr;
      }

      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      document.getElementById('weekday').textContent = days[now.getDay()];

      // 연간(Year) 진행률
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
      const yearProgress = Math.min(100, Math.max(0, Math.round(((now - startOfYear) / (endOfYear - startOfYear)) * 100)));

      // 월간(Month) 진행률
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const monthProgress = Math.min(100, Math.max(0, Math.round(((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100)));

      // 주간(Week) 진행률 (월요일 시작 기준)
      const dayOfWeek = now.getDay();
      const diffToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
      const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
      const weekProgress = Math.min(100, Math.max(0, Math.round(((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100)));

      document.getElementById('year-pct').textContent = `${yearProgress}%`;
      document.getElementById('year-bar').style.width = `${yearProgress}%`;

      document.getElementById('month-pct').textContent = `${monthProgress}%`;
      document.getElementById('month-bar').style.width = `${monthProgress}%`;

      document.getElementById('week-pct').textContent = `${weekProgress}%`;
      document.getElementById('week-bar').style.width = `${weekProgress}%`;
    }

    updateWidget();
    setInterval(updateWidget, 1000);
  </script>
</body>
</html>
