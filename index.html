<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock & Progress Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 세 번째 이미지(#FFF8F8, #DBD5D7) 무드 팔레트 */
      --bg-soft: #FFF8F8;
      --border-greige: #DBD5D7;
      /* #DBD5D7의 가장 어두운 딥 모브 계열 (검정 아님) */
      --clock-bg: #362729;
      --clock-text: #FFFFFF;
      /* 시계 배경색에 투명도를 준 텍스트/숫자 색상 */
      --label-text: rgba(54, 39, 41, 0.72);
      --bar-fill: #615357;
      --bar-track: rgba(219, 213, 215, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: transparent; /* 노션 배경과 자연스럽게 어우러지도록 투명 설정 */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .widget-container {
      width: 100%;
      max-width: 280px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 상단 플립 스타일 시계 영역 */
    .clock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .clock-card {
      position: relative;
      background-color: var(--clock-bg);
      color: var(--clock-text);
      aspect-ratio: 1 / 1.12;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 0px; /* 깔끔한 직각 모서리 */
      overflow: hidden;
    }

    /* 플립 시계 중앙 미세 라인 디테일 */
    .clock-card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(255, 248, 248, 0.12);
      pointer-events: none;
    }

    .clock-number {
      font-size: clamp(2.4rem, 11vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #FFFFFF;
    }

    .clock-sub {
      position: absolute;
      bottom: 8px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
    }

    .clock-sub.left {
      left: 10px;
    }

    .clock-sub.right {
      right: 10px;
    }

    /* 하단 프로그레스 바 영역 */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      width: 100%;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 46px 36px 1fr;
      align-items: center;
      gap: 8px;
    }

    .progress-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--label-text);
      text-transform: lowercase;
      letter-spacing: -0.01em;
    }

    .progress-percent {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--label-text);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background-color: var(--bar-track);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--bar-fill);
      border-radius: 999px;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- 상단 시계 위젯 -->
    <div class="clock-grid">
      <div class="clock-card">
        <span class="clock-number" id="hours">00</span>
        <span class="clock-sub left" id="ampm">AM</span>
      </div>
      <div class="clock-card">
        <span class="clock-number" id="minutes">00</span>
        <span class="clock-sub right" id="weekday">THU</span>
      </div>
    </div>

    <!-- 하단 진행률 바 위젯 (year, month, week) -->
    <div class="progress-list">
      <div class="progress-row">
        <span class="progress-label">year</span>
        <span class="progress-percent" id="year-pct">0%</span>
        <div class="progress-track">
          <div class="progress-fill" id="year-bar"></div>
        </div>
      </div>

      <div class="progress-row">
        <span class="progress-label">month</span>
        <span class="progress-percent" id="month-pct">0%</span>
        <div class="progress-track">
          <div class="progress-fill" id="month-bar"></div>
        </div>
      </div>

      <div class="progress-row">
        <span class="progress-label">week</span>
        <span class="progress-percent" id="week-pct">0%</span>
        <div class="progress-track">
          <div class="progress-fill" id="week-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateWidget() {
      const now = new Date();

      // 1. 시계 업데이트 (12시간제 기준 AM/PM + 요일)
      let hours = now.getHours();
      const minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
       // 0시는 12로 표시

      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const weekday = days[now.getDay()];

      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('weekday').textContent = weekday;

      // 2. 연간(Year) 진행률 계산
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
      const yearProgress = Math.min(100, Math.max(0, Math.round(((now - startOfYear) / (endOfYear - startOfYear)) * 100)));

      // 3. 월간(Month) 진행률 계산
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const monthProgress = Math.min(100, Math.max(0, Math.round(((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100)));

      // 4. 주간(Week) 진행률 계산 (월요일 시작 기준)
      const dayOfWeek = now.getDay(); // 0(일) ~ 6(토)
      const diffToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
      const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
      const weekProgress = Math.min(100, Math.max(0, Math.round(((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100)));

      // DOM 반영
      document.getElementById('year-pct').textContent = `${yearProgress}%`;
      document.getElementById('year-bar').style.width = `${yearProgress}%`;

      document.getElementById('month-pct').textContent = `${monthProgress}%`;
      document.getElementById('month-bar').style.width = `${monthProgress}%`;

      document.getElementById('week-pct').textContent = `${weekProgress}%`;
      document.getElementById('week-bar').style.width = `${weekProgress}%`;
    }

    updateWidget();
    setInterval(updateWidget, 1000);
  </script>
</body>
</html>
