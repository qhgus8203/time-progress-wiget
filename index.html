<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock & Progress Widget</title>
  <style>
    :root {
      --bg: #fff8f8;              /* 위젯 전체 배경 (사진 1의 첫 번째 색) */
      --clock-bg: #4a4246;        /* 시계 배경 (#DBD5D7을 어둡게 한 색, 검정 아님) */
      --clock-text: #ffffff;      /* 시계 숫자 */
      --ink: rgba(74, 66, 70, 0.7);      /* 라벨·퍼센트: 시계 배경색의 투명 버전 */
      --track: rgba(74, 66, 70, 0.12);   /* 막대 바탕 */
      --fill: rgba(74, 66, 70, 0.6);     /* 막대 진행 부분 */
      --border: #dbd5d7;          /* 테두리 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Malgun Gothic", "Segoe UI", sans-serif;
    }

    .widget {
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }

    /* 시계 */
    .clock {
      background: var(--clock-bg);
      border-radius: 10px;
      padding: 14px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .clock-unit {
      color: var(--clock-text);
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .colon {
      color: var(--clock-text);
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      opacity: 0.85;
    }

    /* 진행률 */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 2px 2px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-label {
      width: 48px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      text-transform: lowercase;
      flex-shrink: 0;
    }

    .progress-percent {
      width: 40px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--fill);
      border-radius: 999px;
      transition: width 0.6s ease;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="clock">
      <div class="clock-unit" id="hh">00</div>
      <div class="colon">:</div>
      <div class="clock-unit" id="mm">00</div>
    </div>

    <div class="progress-list">
      <div class="progress-row">
        <div class="progress-label">year</div>
        <div class="progress-percent" id="year-pct">0%</div>
        <div class="progress-track"><div class="progress-fill" id="year-bar"></div></div>
      </div>
      <div class="progress-row">
        <div class="progress-label">month</div>
        <div class="progress-percent" id="month-pct">0%</div>
        <div class="progress-track"><div class="progress-fill" id="month-bar"></div></div>
      </div>
      <div class="progress-row">
        <div class="progress-label">week</div>
        <div class="progress-percent" id="week-pct">0%</div>
        <div class="progress-track"><div class="progress-fill" id="week-bar"></div></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const hhEl = document.getElementById("hh");
      const mmEl = document.getElementById("mm");

      const yearPct  = document.getElementById("year-pct");
      const monthPct = document.getElementById("month-pct");
      const weekPct  = document.getElementById("week-pct");
      const yearBar  = document.getElementById("year-bar");
      const monthBar = document.getElementById("month-bar");
      const weekBar  = document.getElementById("week-bar");

      const pad = (n) => String(n).padStart(2, "0");

      function update() {
        const now = new Date();

        // 시계 (24시간제)
        hhEl.textContent = pad(now.getHours());
        mmEl.textContent = pad(now.getMinutes());

        // 연간 진행률: 올해 경과 시간 / 올해 전체 시간
        const yearStart = new Date(now.getFullYear(), 0, 1);
        const nextYear  = new Date(now.getFullYear() + 1, 0, 1);
        const yearP = (now - yearStart) / (nextYear - yearStart);

        // 월간 진행률: 이번 달 경과 시간 / 이번 달 전체 시간
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const nextMonth  = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        const monthP = (now - monthStart) / (nextMonth - monthStart);

        // 주간 진행률: 월요일 시작 기준 이번 주 경과 시간 / 7일
        const dayIndex = (now.getDay() + 6) % 7; // 월=0 ... 일=6
        const msIntoDay = now - new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const weekP = (dayIndex + msIntoDay / 86400000) / 7;

        setProgress(yearPct, yearBar, yearP);
        setProgress(monthPct, monthBar, monthP);
        setProgress(weekPct, weekBar, weekP);
      }

      function setProgress(pctEl, barEl, ratio) {
        const pct = Math.floor(ratio * 100);
        pctEl.textContent = pct + "%";
        barEl.style.width = (ratio * 100).toFixed(2) + "%";
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
